name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  proofs:
    runs-on: ubuntu-latest
    env:
      VERUS_RELEASE: 0.2026.11.02.8bf68ee
      VERUS_SHA256: f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/cache@v6
        id: verus
        with:
          path: ~/tools/verus
          key: verus-${{ runner.os }}-${{ env.VERUS_RELEASE }}
      - if: steps.verus.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release/$VERUS_RELEASE/verus-$VERUS_RELEASE-x86-linux.zip"
          echo "$VERUS_SHA256  verus.zip" | sha256sum --check
          mkdir -p "$HOME/tools/verus"
          unzip -q verus.zip -d "$HOME/tools/verus"
      - uses: Swatinem/rust-cache@v2
      - run: pwsh tools/proofs.ps1 -Required

  build:
    name: build (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p genie -p genie-cli
      - uses: actions/upload-artifact@v7
        with:
          name: genie-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/genie
            target/release/genie.exe
            target/release/genie-cli.exe
          if-no-files-found: error
          retention-days: 30
